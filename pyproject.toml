[project]
name = "phasebreak"
version = "0.1.0"
description = "Universal Phase Transition Detection with Adversarial AI Validation"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "plotly>=5.18",
    "yfinance>=0.2.36",
    "fredapi>=0.5.2",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "lifelines>=0.29",
    "hmmlearn>=0.3",
    "chernoffpy>=0.1.0",
    "structlog>=24.1",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "jupyter>=1.0",
    "ipykernel>=6.29",
]
geo = [
    "rasterio>=1.3",
    "rioxarray>=0.15",
]
# v2 pipeline enhancements — required for official benchmark results
v2 = [
    "hurst>=0.0.5",
    "MFDFA>=0.4",
]
# Science layer — required for TOST equivalence claims in paper
science = [
    "pingouin>=0.5",
]
# Baselines comparison
benchmark = [
    "bayesian_changepoint_detection",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
